## IDF Component Manager manifest
dependencies:
  # LVGL runtime port that attaches to an existing esp_lcd panel handle
  # (display bring-up stays in components/display — hardware-validated)
  espressif/esp_lvgl_port: "^2.0.0"
  # GT911 capacitive touch (I2C: GPIO8=SCL, GPIO7=SDA on this board)
  espressif/esp_lcd_touch_gt911: "^1.1.0"
  lvgl/lvgl:
    version: "~9.5.0"
    public: true
